<svg width="100%" height="100%" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1E1E2E"/>
      <stop offset="100%" stop-color="#0F0F14"/>
    </radialGradient>

    <!-- Forge To Macro Energy Gradient -->
    <linearGradient id="forgeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FF4500"/>
      <stop offset="50%" stop-color="#FF8C00"/>
      <stop offset="100%" stop-color="#836EF9"/>
    </linearGradient>

    <!-- Glow Effect Matrix -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Dark Premium Canvas Container -->
  <rect width="512" height="512" rx="64" fill="url(#bgGrad)"/>

  <g transform="translate(256, 240)">
    <!-- The Hexagonal Forge Shield Outer Frame -->
    <polygon points="0,-170 147,-85 147,85 0,170 -147,85 -147,-85" 
             fill="none" 
             stroke="url(#forgeGrad)" 
             stroke-width="14" 
             stroke-linejoin="round"
             opacity="0.85"
             filter="url(#glow)"/>

<!-- Left Macro Curly Bracket { (Structural Component Code Engine) -->
    <path d="M -75,-65 C -75,-65 -115,-60 -115,-25 C -115,-5 -130,0 -130,0 C -130,0 -115,5 -115,25 C -115,60 -75,65 -75,65" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="16" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Right Macro Curly Bracket } -->
    <path d="M 75,-65 C 75,-65 115,-60 115,-25 C 115,-5 130,0 130,0 C 130,0 115,5 115,25 C 115,60 75,65 75,65" 
          fill="none" 
          stroke="#FFFFFF" 
          stroke-width="16" 
          stroke-linecap="round" 
          stroke-linejoin="round"/>

    <!-- Central Energy Core (The Macro Compiling Lightning Core) -->
    <polygon points="-25,-90 35,-90 -10,-10 40,-10 -45,100 -15,15" 
             fill="url(#forgeGrad)"
             filter="url(#glow)"/>
  
  </g>

  <!-- Crate Label Typography Segment -->
  <text x="256" y="455" 
        text-anchor="middle" 
        fill="#FFFFFF" 
        font-family="system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, monospace" 
        font-size="34" 
        font-weight="800" 
        letter-spacing="4">FORGE-RSX</text>
</svg>